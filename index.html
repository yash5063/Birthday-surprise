<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#fffaf3" />
  <meta name="description" content="A cute, interactive birthday surprise made with vanilla HTML, CSS and JavaScript." />
  <title>Birthday Surprise ✨</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="is-locked">
  <noscript>
    <div class="noscript-note">This birthday surprise needs JavaScript enabled 🎂</div>
  </noscript>

  <canvas id="confetti-canvas" aria-hidden="true"></canvas>
  <div class="cursor-glow" aria-hidden="true"></div>
  <div id="doodle-layer" class="doodle-layer" aria-hidden="true"></div>

  <button id="music-toggle" class="floating-control music-toggle is-hidden" type="button" aria-pressed="false" aria-label="Play background music">
    <span class="music-icon" aria-hidden="true">♫</span>
    <span class="music-label">Music</span>
  </button>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <main>
    <section id="intro" class="intro-screen" aria-labelledby="intro-title">
      <div class="intro-orbit orbit-one" aria-hidden="true"></div>
      <div class="intro-orbit orbit-two" aria-hidden="true"></div>
      <div class="intro-card glass-card">
        <p id="intro-eyebrow" class="eyebrow"></p>
        <div id="intro-lines" class="intro-lines"></div>

        <button id="gift-button" class="gift-button" type="button" aria-describedby="gift-hint">
          <span class="gift" aria-hidden="true">
            <span class="gift-lid"><span class="gift-bow">✦</span></span>
            <span class="gift-box"><span class="gift-ribbon"></span></span>
          </span>
          <span id="gift-button-text" class="gift-button-text"></span>
        </button>
        <p id="gift-hint" class="sr-only">Opens the birthday surprise</p>
      </div>
    </section>

    <div id="site-content" class="site-content" aria-hidden="true">
      <section id="hero" class="hero-section section-shell">
        <div class="hero-blob blob-a" aria-hidden="true"></div>
        <div class="hero-blob blob-b" aria-hidden="true"></div>
        <div class="hero-stars" aria-hidden="true">✦　♡　✿　✧　☆</div>

        <div class="hero-copy reveal">
          <div id="hero-badge" class="pill"></div>
          <h1 id="hero-title"></h1>
          <p id="hero-subtitle" class="hero-subtitle"></p>
          <div id="hero-note" class="handwritten-note"></div>
          <a id="hero-scroll" class="scroll-hint" href="#memories"></a>
        </div>
      </section>

      <section id="memories" class="content-section section-shell">
        <div class="section-heading reveal">
          <p id="memories-eyebrow" class="eyebrow"></p>
          <h2 id="memories-title"></h2>
          <p id="memories-subtitle" class="section-subtitle"></p>
        </div>
        <div id="memory-grid" class="memory-grid"></div>
      </section>

      <section id="reasons" class="content-section section-shell section-tinted">
        <div class="section-heading reveal">
          <p id="reasons-eyebrow" class="eyebrow"></p>
          <h2 id="reasons-title"></h2>
          <p id="reasons-subtitle" class="section-subtitle"></p>
        </div>
        <div id="reasons-grid" class="reasons-grid"></div>
      </section>

      <section id="cake-section" class="content-section section-shell cake-section">
        <div class="section-heading reveal">
          <p id="cake-eyebrow" class="eyebrow"></p>
          <h2 id="cake-title"></h2>
          <p id="cake-subtitle" class="section-subtitle"></p>
        </div>

        <div class="cake-stage reveal">
          <div id="wish-bubble" class="wish-bubble"></div>
          <div class="cake" aria-label="Birthday cake with candles">
            <div id="candles" class="candles"></div>
            <div class="cake-top"></div>
            <div class="cake-layer layer-top"><span class="sprinkles" aria-hidden="true"></span></div>
            <div class="cake-filling"></div>
            <div class="cake-layer layer-bottom"></div>
            <div class="cake-plate"></div>
          </div>
          <button id="blow-button" class="primary-button" type="button"></button>
          <div id="wish-result" class="wish-result" aria-live="polite"></div>
        </div>
      </section>

      <section id="final-message" class="content-section section-shell final-section section-tinted">
        <article class="letter-card reveal">
          <p id="final-eyebrow" class="eyebrow"></p>
          <h2 id="final-title"></h2>
          <div id="final-paragraphs" class="letter-copy"></div>
          <p id="final-signoff" class="final-signoff"></p>
          <p id="final-signature" class="final-signature"></p>
        </article>
      </section>

      <footer class="footer section-shell">
        <button id="replay-button" class="text-button" type="button"></button>
        <p id="footer-text"></p>
      </footer>
    </div>
  </main>

  <dialog id="memory-dialog" class="memory-dialog">
    <button id="dialog-close" class="dialog-close" type="button" aria-label="Close photo">×</button>
    <img id="dialog-image" src="" alt="" />
    <div class="dialog-copy">
      <h3 id="dialog-title"></h3>
      <p id="dialog-note"></p>
    </div>
  </dialog>

  <audio id="background-music" preload="metadata"></audio>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
